services:
  - type: web
    name: quickpulse-poll-survey
    env: node
    plan: free
    buildCommand: npm install && npm run migrate && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: quickpulse-db
          property: connectionString

databases:
  - name: quickpulse-db
    plan: free
    databaseName: quickpulse
    user: quickpulse_user
